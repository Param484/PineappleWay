{% extends "admin_base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="row">

<div class="col-md-3 mb-4">

<div class="card dashboard-card shadow text-center p-4">

<i class="fa-solid fa-users dashboard-icon text-primary"></i>

<h5 class="mt-3">

Users

</h5>

<h2>

{{ total_users }}

</h2>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card dashboard-card shadow text-center p-4">

<i class="fa-solid fa-box dashboard-icon text-warning"></i>

<h5 class="mt-3">

Packages

</h5>

<h2>

{{ total_packages }}

</h2>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card dashboard-card shadow text-center p-4">

<i class="fa-solid fa-calendar-check dashboard-icon text-success"></i>

<h5 class="mt-3">

Bookings

</h5>

<h2>

{{ total_bookings }}

</h2>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card dashboard-card shadow text-center p-4">

<i class="fa-solid fa-clock dashboard-icon text-danger"></i>

<h5 class="mt-3">

Pending

</h5>

<h2>

{{ pending_bookings }}

</h2>

</div>

</div>

</div>

{% endblock %}
