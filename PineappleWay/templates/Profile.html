{% extends "base.html" %}

{% block title %}My Profile | PineappleWay{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>👤 My Profile</h3>

</div>

<div class="card-body">

<form method="POST" action="/profile">

<div class="mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="fullname"
class="form-control"
value="{{ user.fullname }}"
required>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
class="form-control"
value="{{ user.email }}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ user.phone }}"
required>

</div>

<button
type="submit"
class="btn btn-success">

Update Profile

</button>

<a href="/user_dashboard"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
